<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tezkorlik O'yini</title>
    <style>
        body { 
            text-align: center; 
            background: #1a1a1a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding-top: 20px;
        }
        #game-box {
            position: relative;
            width: 90vw;
            height: 70vh;
            margin: 20px auto;
            border: 2px dashed #444;
            background: #222;
            overflow: hidden;
        }
        #target { 
            width: 50px; 
            height: 50px; 
            background: #ff4757; 
            border-radius: 50%; 
            position: absolute; 
            cursor: pointer; 
            display: none; 
            box-shadow: 0 0 10px #ff4757;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Reaksiya va Tezlik O'yini</h1>
    <p>Ball: <span id="score">0</span></p>
    <button onclick="startGame()">O'yinni boshlash</button>

    <div id="game-box">
        <div id="target" onclick="hitTarget()"></div>
    </div>

    <script>
        let score = 0;

        function startGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            nextTarget();
        }

        function nextTarget() {
            const target = document.getElementById('target');
            const box = document.getElementById('game-box');
            
            // Nishon faqat ramka (game-box) ichida chiqishi uchun:
            const maxX = box.clientWidth - 60;
            const maxY = box.clientHeight - 60;
            
            const x = Math.max(10, Math.floor(Math.random() * maxX));
            const y = Math.max(10, Math.floor(Math.random() * maxY));
            
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.style.display = 'block';
        }

        function hitTarget() {
            score++;
            document.getElementById('score').innerText = score;
            nextTarget();
        }
    </script>
</body>
</html>
